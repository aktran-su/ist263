<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .row {
      display: flex;
      flex-wrap: wrap;
      width: 100%;
      padding: 2em;
      gap: 1em;
    }

    .col1, .col2, .col3, .col4 {
      flex: 1;
      padding: 2em;
      background-color: #FFFFFF;
      border-radius: 1em;
    }

    .col2, .col3, .col4 {
      flex: 2;
    }

    /* Skip link styling */
    .skip {
      position: absolute;
      top: -40px;
      left: 0;
      background: #000;
      color: #fff;
      padding: 8px;
      z-index: 100;
    }

    .skip:focus {
      top: 0;
    }
  </style>
</head>

<body>

<header>
  <a href="#main" class="skip">Skip to main content</a>

  <nav aria-label="Main navigation">
    <a href="index.html">Home |</a> 
    <a href="skills.html">Skills |</a> 
    <a href="contact.html">Contact</a>
  </nav>

  <h1>Contact</h1>
</header>

<main id="main">

  <!-- ROW 1 -->
  <div class="row">
    <div class="col1">
      <address>
        <p>Alyssa Tran</p>
        <p>7414 15th Ave</p>
        <p>Brooklyn, NY 11228</p>
      </address>
    </div>

    <div class="col2">
      <p>
        <a href="mailto:aktran@syr.edu">Email Alyssa Tran</a>
      </p>
      <p>
        <a href="https://www.linkedin.com/in/alyssa-tran-926100223">
          Visit Alyssa Tran’s LinkedIn profile
        </a>
      </p>
      <img src="../images/logo_sized.png" 
           alt="LinkedIn logo" 
           width="100">
    </div>
  </div>

  <!-- ROW 2 -->
  <div class="row">
    <div class="col3">

      <form action="https://formspree.io/f/xreazzvo" method="POST">
        
        <div>
          <label for="name">Your Name:</label><br>
          <input type="text" id="name" name="name" required>
        </div>

        <fieldset>
          <legend>I am a:</legend>

          <input type="checkbox" id="type1" name="type" value="Student">
          <label for="type1">Student</label><br>

          <input type="checkbox" id="type2" name="type" value="Teacher">
          <label for="type2">Teacher</label><br>

          <input type="checkbox" id="type3" name="type" value="Other">
          <label for="type3">Other</label>
        </fieldset>

        <div>
          <label for="comments">Comments:</label><br>
          <textarea id="comments" name="comments" rows="4" cols="50"></textarea>
        </div>

        <button type="submit">Send form</button>

      </form>
    </div>

    <div class="col4">
      <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d24228.314351961926!2d-74.0234326544933!3d40.6179872776923!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c24515a330f483%3A0x424d47bf9300db51!2s7414%2015th%20Ave%2C%20Brooklyn%2C%20NY%2011228!5e0!3m2!1sen!2sus!4v1769635690421!5m2!1sen!2sus"
        title="Map showing 7414 15th Ave, Brooklyn, New York"
        width="100%"
        height="450"
        style="border:0;"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>
  </div>

</main>

<footer>
  <p>&copy; 2026 Alyssa Tran</p>
</footer>

</body>
</html>
